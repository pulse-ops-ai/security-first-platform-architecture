name: pre-commit

# Runs the pre-commit hook suite on every PR and on pushes to main.
# Hook definitions live in .pre-commit-config.yaml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    # Reusable mode: consumer repos can invoke this workflow to run
    # pre-commit against their own checkout using their own
    # .pre-commit-config.yaml. No inputs required — pre-commit is a
    # generic runner that operates on the calling repo's files.

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so secret scanners can inspect the diff range.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pipx install pre-commit || pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
