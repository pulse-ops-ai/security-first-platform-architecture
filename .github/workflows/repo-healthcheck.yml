name: repo-healthcheck

# Validates the calling repo against standards/repo-contract.md via
# scripts/repo-healthcheck.sh. The script auto-detects architecture-
# repo vs consumer-repo mode through the presence of the
# standards/repo-contract.md sentinel.
#
# Dual mode:
#   - Architecture-repo CI (self-invoked): runs against this repo;
#     script detects architecture-repo mode and skips consumer-only
#     checks.
#   - Consumer-repo CI (workflow_call): the consumer's caller
#     workflow invokes this with `architecture_ref`; this workflow
#     checks out both the consumer (default) and the architecture
#     repo (for the script), then runs the script against the
#     consumer's tree where it operates in consumer-repo mode.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/skills/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - 'openspec/README.md'
      - 'standards/repo-contract.md'
      - 'scripts/repo-healthcheck.sh'
      - '.github/workflows/repo-healthcheck.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      architecture_ref:
        description: "The architecture-repo ref to use for the script. Required when called from a consumer repo; leave empty for self-invocation."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  repo-healthcheck:
    name: Repo follows the security-first platform contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout architecture repo for scripts (consumer call only)
        # Explicit `workflow_call` gate (defense in depth): in self-mode
        # (push / pull_request / workflow_dispatch) the `inputs` context is
        # empty, but we don't want to rely on that subtle coercion — a leaked
        # truthy check here would silently switch self-mode to running the
        # architecture-repo's default-branch script against the PR, masking
        # the PR's own changes to that script. Gate on event_name explicitly.
        if: github.event_name == 'workflow_call' && inputs.architecture_ref != ''
        uses: actions/checkout@v4
        with:
          repository: pulse-ops-ai/security-first-platform-architecture
          ref: ${{ inputs.architecture_ref }}
          path: .arch-tools
          sparse-checkout: scripts

      - name: Determine script path (or fail with a clear consumer-mode error)
        id: script
        run: |
          if [[ -d .arch-tools ]]; then
            echo "path=.arch-tools/scripts/repo-healthcheck.sh" >> "$GITHUB_OUTPUT"
          elif [[ -f scripts/repo-healthcheck.sh ]]; then
            echo "path=scripts/repo-healthcheck.sh" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: cannot locate scripts/repo-healthcheck.sh." >&2
            echo "" >&2
            echo "Self-invocation mode expects the script in the caller's checkout." >&2
            echo "Consumer-repo callers MUST pass 'architecture_ref' in the 'with:'" >&2
            echo "block so this workflow can sparse-checkout the architecture repo." >&2
            echo "" >&2
            echo "Example consumer caller:" >&2
            echo "" >&2
            echo "  jobs:" >&2
            echo "    call:" >&2
            echo "      uses: pulse-ops-ai/security-first-platform-architecture/.github/workflows/repo-healthcheck.yml@<ref>" >&2
            echo "      with:" >&2
            echo "        architecture_ref: <ref>" >&2
            exit 1
          fi

      - name: Run repo-healthcheck
        run: bash "${{ steps.script.outputs.path }}" .
