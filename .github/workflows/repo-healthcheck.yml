name: repo-healthcheck

# Validates the calling repo against standards/repo-contract.md via
# scripts/repo-healthcheck.sh. The script auto-detects architecture-
# repo vs consumer-repo mode through the presence of the
# standards/repo-contract.md sentinel.
#
# Dual mode:
#   - Architecture-repo CI (self-invoked): runs against this repo;
#     script detects architecture-repo mode and skips consumer-only
#     checks.
#   - Consumer-repo CI (workflow_call): the consumer's caller
#     workflow invokes this with `architecture_ref`; this workflow
#     checks out both the consumer (default) and the architecture
#     repo (for the script), then runs the script against the
#     consumer's tree where it operates in consumer-repo mode.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/skills/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - 'openspec/README.md'
      - 'standards/repo-contract.md'
      - 'scripts/repo-healthcheck.sh'
      - '.github/workflows/repo-healthcheck.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      architecture_ref:
        description: "The architecture-repo ref to sparse-checkout for the script. REQUIRED for consumer-mode invocation — there is no fallback to the caller's `scripts/` directory, because doing so would let a consumer vendor a tweaked script and still pass the check."
        required: true
        type: string

permissions:
  contents: read

jobs:
  repo-healthcheck:
    name: Repo follows the security-first platform contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      - name: Checkout architecture repo for scripts (consumer call only)
        # Mode discriminator: `inputs.architecture_ref` is populated iff this
        # workflow was invoked via `workflow_call` (the consumer's thin caller
        # passes it; `required: true` on the input guarantees non-empty in
        # that case). In self-mode (push / pull_request / workflow_dispatch
        # on the architecture repo itself) the `inputs` context is empty, so
        # `inputs.architecture_ref` evaluates to '' and this step is skipped.
        #
        # NOTE: Do NOT gate on `github.event_name == 'workflow_call'` — in a
        # reusable workflow the `github` context reflects the CALLER's event
        # (e.g., `pull_request`), not `workflow_call`. That mistake silently
        # disabled consumer-mode in PR #14 round-4 and was the root cause of
        # the first consumer's broken CI. This guard is the corrected design.
        if: inputs.architecture_ref != ''
        uses: actions/checkout@v7
        with:
          repository: pulse-ops-ai/security-first-platform-architecture
          ref: ${{ inputs.architecture_ref }}
          path: .arch-tools
          sparse-checkout: scripts

      - name: Determine script path
        id: script
        # Mode-strict selection driven by the same discriminator as the
        # checkout step above. Consumer mode MUST use the architecture-repo
        # checkout at .arch-tools/; we never fall back to the caller's
        # `scripts/` directory because doing so would let a consumer vendor
        # a tweaked script and still pass this check. Self mode uses the
        # script from this repo's own checkout.
        run: |
          if [[ -n "${{ inputs.architecture_ref }}" ]]; then
            if [[ ! -f .arch-tools/scripts/repo-healthcheck.sh ]]; then
              echo "ERROR: consumer-mode (workflow_call) requires the architecture-repo sparse-checkout at .arch-tools/, but scripts/repo-healthcheck.sh was not found there." >&2
              echo "This typically means the previous checkout step did not run; verify the caller passed a valid architecture_ref." >&2
              exit 1
            fi
            echo "path=.arch-tools/scripts/repo-healthcheck.sh" >> "$GITHUB_OUTPUT"
          else
            if [[ ! -f scripts/repo-healthcheck.sh ]]; then
              echo "ERROR: self-mode expects scripts/repo-healthcheck.sh in the caller's checkout." >&2
              exit 1
            fi
            echo "path=scripts/repo-healthcheck.sh" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repo-healthcheck
        run: bash "${{ steps.script.outputs.path }}" .
