# kong.example.yml
#
# Reference declarative configuration for Kong CE in DB-less mode.
# Maps L2 (edge gateway) responsibilities: routing, JWT verification at
# the edge, rate limits, and request-id propagation. Fine-grained authz
# happens at L4 (OpenFGA) downstream of Kong.
#
# Replace __DOMAIN__, __KEYCLOAK_JWKS_URL__, __SIGNING_KEY__ before use.
# Secrets must come from a secret manager, not this file.

_format_version: "3.0"
_transform: true

services:
  - name: bff-example
    url: http://bff-example:8080
    routes:
      - name: bff-api
        hosts: ["api.__DOMAIN__"]
        paths: ["/v1"]
        strip_path: false
        plugins:
          # ---- L3 identity verification at the edge ----
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
          # ---- L5 operational guardrails ----
          - name: rate-limiting
            config:
              minute: 600
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: false   # fail closed
          - name: request-size-limiting
            config:
              allowed_payload_size: 10
          # ---- Observability: correlation ----
          - name: correlation-id
            config:
              header_name: x-request-id
              generator: uuid
              echo_downstream: true

consumers:
  # Consumers are created by the identity flow. This file declares the
  # shape; real consumer entries come from the IdP integration script,
  # not from this checked-in file.
  - username: __PLACEHOLDER_CONSUMER__
    jwt_secrets:
      - key: __PLACEHOLDER_KEY_ID__
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          __REPLACE_WITH_KEYCLOAK_REALM_PUBLIC_KEY__
          -----END PUBLIC KEY-----

plugins:
  # Global plugins applied to every route.
  - name: ip-restriction
    config:
      allow: ["0.0.0.0/0"]    # tighten in production
  - name: bot-detection
