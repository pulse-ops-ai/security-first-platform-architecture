# .gitleaks.toml
#
# Repo-specific configuration for gitleaks. We extend the default rule set
# (no rules disabled) and add a NARROW allowlist for known-false-positive
# paths. Do not widen this without an ADR.
#
# Each entry below must include:
#   - the path or pattern being excluded
#   - the reason it's a false positive
#   - a date and reviewer (optional, recommended for audit)

# Extend (don't replace) the gitleaks default rule set.
[extend]
useDefault = true

# ----- Allowlists -----
#
# .secrets.baseline (Yelp/detect-secrets):
#   This file is the persisted output of the detect-secrets baseline. It
#   stores SHA-1 hashes of accepted findings. Those hashes are
#   high-entropy hex strings that gitleaks's generic-api-key rule flags
#   as potential secrets. They are NOT secrets — they are hashes of
#   placeholder strings from infra/profiles/self-hosted-vps/keycloak/
#   realm-export.example.json that we have explicitly accepted.
#
#   detect-secrets itself still scans the rest of the repo for real
#   secrets and writes its results back to this file. Gitleaks continues
#   to scan everything else in the repo.

[allowlist]
description = "Narrow allowlist — see comments above each entry."
paths = [
  '''^\.secrets\.baseline$''',
]
